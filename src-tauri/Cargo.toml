[package]
name = "ds10"
version = "0.1.0"
description = "DS10 — fast FITS image and table viewer"
authors = ["ds10 contributors"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ds10_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"

[profile.dev.package."*"]
# Optimize dependencies even in dev builds; FITS decode on multi-GB files is
# unusable at opt-level 0 while our own crate stays fast to recompile.
opt-level = 2
